name: Release

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      artifact-run-id:
        description: "Create release from artifacts"
        required: false
        type: string

env:
  VERSION: "0.1"

jobs:
  release:
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
      contents: write
    steps:
      - name: Choose artifacts to release (blank is latest)
        id: release-source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUILD_RUN_ID="${{ inputs.artifact-run-id }}"
            if [ -z "$BUILD_RUN_ID" ]; then
              BUILD_RUN_ID=$(curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yaml/runs?branch=main&status=success&per_page=1" \
                | jq -r '.workflow_runs[0].id')

              if [ -z "$BUILD_RUN_ID" ] || [ "$BUILD_RUN_ID" = "null" ]; then
                echo "No successful Build run found on main." >&2
                exit 1
              fi
            fi

            BUILD_RUN_JSON=$(curl -fsSL \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$BUILD_RUN_ID")

            BUILD_RUN_NAME=$(echo "$BUILD_RUN_JSON" | jq -r '.name')
            BUILD_RUN_CONCLUSION=$(echo "$BUILD_RUN_JSON" | jq -r '.conclusion')
            CHECKOUT_REF=$(echo "$BUILD_RUN_JSON" | jq -r '.head_sha')

            if [ "$BUILD_RUN_NAME" != "Build" ]; then
              echo "Run $BUILD_RUN_ID is '$BUILD_RUN_NAME', not 'Build'." >&2
              exit 1
            fi

            if [ "$BUILD_RUN_CONCLUSION" != "success" ]; then
              echo "Build run $BUILD_RUN_ID concluded with '$BUILD_RUN_CONCLUSION', not 'success'." >&2
              exit 1
            fi
          else
            BUILD_RUN_ID="${{ github.event.workflow_run.id }}"
            CHECKOUT_REF="${{ github.event.workflow_run.head_sha }}"
          fi

          echo "build-run-id=$BUILD_RUN_ID" >> $GITHUB_OUTPUT
          echo "checkout-ref=$CHECKOUT_REF" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.release-source.outputs.checkout-ref }}
      
      - name: Prepare release tags
        id: release-tags
        run: |
          TIMESTAMP=$(date +'%Y%m%d%H%M%S')
          TIMESTAMP_TAG="${VERSION}-${TIMESTAMP}"
          LATEST_TAG="${VERSION}-latest"

          echo "timestamp-tag=$TIMESTAMP_TAG" >> $GITHUB_OUTPUT
          echo "latest-tag=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.release-source.outputs.build-run-id }}
          pattern: pluscilib-*
          path: ./artifacts/
          merge-multiple: false

      - name: Create archive packages
        run: |
          cd artifacts
          tar -czf pluscilib-darwin-m1.tar.gz -C pluscilib-darwin-m1 .
          tar -czf pluscilib-linux-aarch64.tar.gz -C pluscilib-linux-aarch64 .
          tar -czf pluscilib-linux-neoverse_v2.tar.gz -C pluscilib-linux-neoverse_v2 .
          tar -czf pluscilib-linux-x86_64.tar.gz -C pluscilib-linux-x86_64 .

      - name: Push release tags
        run: |
          git config user.name "Brandon Murakami"
          git config user.email "bmurakami@berkeley.edu"

          git tag "${{ steps.release-tags.outputs.timestamp-tag }}"
          git tag --force "${{ steps.release-tags.outputs.latest-tag }}"
          git push origin "${{ steps.release-tags.outputs.timestamp-tag }}"
          git push --force origin "${{ steps.release-tags.outputs.latest-tag }}"

      - name: Create timestamped release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tags.outputs.timestamp-tag }}
          name: Release ${{ steps.release-tags.outputs.timestamp-tag }}
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            artifacts/*.tar.gz

      - name: Create version latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release-tags.outputs.latest-tag }}
          name: Release ${{ steps.release-tags.outputs.latest-tag }}
          draft: false
          prerelease: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            artifacts/*.tar.gz
